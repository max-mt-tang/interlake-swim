<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Team editor · Interlake Swim &amp; Dive</title>
    <link rel="icon" href="assets/favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="editor.css" />
    <script src="team-data.js"></script>
    <script type="module" src="editor.js"></script>
  </head>
  <body class="auth-screen">
    <header class="editor-header">
      <a class="editor-brand" href="/" aria-label="Interlake Swim and Dive home"><img src="assets/interlake-logo.svg" width="174" height="52" alt="Interlake High School"><span>SWIM &amp; DIVE</span></a>
      <div class="editor-header-actions"><a href="/">Back to team site <span aria-hidden="true">↗</span></a><button id="signout" hidden>Sign out</button></div>
    </header>
    <main class="editor-main">
      <h1 id="editor-title">Coach sign-in</h1>
      <p id="message" role="status" aria-live="polite">Loading…</p>
      <section id="login" aria-labelledby="editor-title" hidden>
        <p class="login-intro">For Coach Eberth to post updates and Max to test posting.</p>
        <form id="login-form">
          <label for="email">Email</label>
          <select id="email" name="email" required>
            <option value="maxmttang@gmail.com">Max · maxmttang@gmail.com</option>
            <option value="s-tangm@bsd405.org">Max (school) · s-tangm@bsd405.org</option>
            <option value="riverae@bsd405.org" selected>Coach Eberth · riverae@bsd405.org</option>
          </select>
          <button type="button" id="google-login" hidden>Continue with Google <span aria-hidden="true">→</span></button>
          <div id="password-signin">
          <label for="password">Password</label>
          <div class="password-field">
            <input id="password" type="password" autocomplete="current-password" required placeholder="Enter your password">
            <button type="button" id="toggle-password" aria-controls="password" aria-pressed="false">Show password</button>
          </div>
          <button type="submit" class="primary email-signin">Sign in</button>
          <button type="button" id="reset">Forgot password?</button>
          </div>
        </form>
        <p class="login-footer">Looking for team news? <a href="/#updates">Read updates</a></p>
      </section>
      <section id="verification" hidden>
        <h2>Verify your email</h2>
        <p>Open the verification message in your inbox, then return here.</p>
        <button id="resend">Send verification email</button>
        <button id="check-verification">I’ve verified my email</button>
      </section>
      <section id="workspace" hidden>
        <div class="editor-actions">
          <button id="new-post">New update</button
          ><button id="reload-posts">Refresh list</button
          ><button id="import-posts" hidden>
            Import existing weekly update</button
          ><a href="/#updates" target="_blank" rel="noopener"
            >View published updates ↗</a
          >
        </div>
        <div class="editor-layout">
          <aside>
            <h2>Your team’s posts</h2>
            <div id="post-list"></div>
          </aside>
          <form id="post-form">
            <h2 id="form-heading">New update</h2>
            <label>Title<input id="title" maxlength="160" required /></label>
            <div class="editor-row">
              <label>Date<input id="post-date" type="date" required /></label
              ><label
                >Category<select id="category">
                  <option>Coach update</option>
                  <option>Meet reminder</option>
                  <option>Practice change</option>
                  <option>Team announcement</option>
                </select></label
              >
            </div>
            <label
              >Message<textarea
                id="body"
                rows="12"
                maxlength="20000"
                required
              ></textarea></label
            ><label
              >Optional link<input
                id="post-link"
                type="url"
                placeholder="https://"
                maxlength="2048" /></label
            ><label>Link text<input id="link-label" maxlength="100" /></label
            ><label class="check-label"
              ><input id="pinned" type="checkbox" /> Pin this update</label
            >
            <div class="editor-actions">
              <button type="button" id="preview-button">Preview</button
              ><button type="submit" value="draft">
                Save draft / unpublish</button
              ><button type="submit" value="publish" class="primary">
                Publish update
              </button>
            </div>
            <p id="save-state"></p>
            <article id="preview" hidden></article>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
